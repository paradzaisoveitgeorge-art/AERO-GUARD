<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}AERO-GUARD{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-brand">
        <img src="{{ url_for('static', filename='img/aero-guard-logo.png') }}"
             alt="AERO-GUARD" class="auth-brand__logo" />
        <div class="brand-tag">Provider Console</div>
      </div>
      {% block body %}{% endblock %}
    </div>
  </div>
</body>
</html>
