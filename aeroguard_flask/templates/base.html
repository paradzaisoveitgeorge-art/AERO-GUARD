<!doctype html>
<html lang="en">
<head>

  {% include "partials/_head_meta.html" %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <script src="{{ url_for('static', filename='js/submit-guard.js') }}" defer></script>
</head>
<body>
