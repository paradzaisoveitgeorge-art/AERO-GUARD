<aside class="sidebar">
  <a href="{{ url_for('provider_dashboard') }}" class="sidebar__brand">
    <img src="{{ url_for('static', filename='img/aero-guard-logo.png') }}"
         alt="AERO-GUARD" class="sidebar__logo-img" />
    <div>
      <div class="sidebar__title">AERO-GUARD</div>
      <div class="sidebar__subtitle">Helpdesk Console</div>
    </div>
  </a>

  <nav class="sidebar__nav">
    {% for group in nav_groups %}
    <div class="sidebar__group">
      <div class="sidebar__group-label">{{ group.label }}</div>
      {% for item in group['items'] %}
      <a href="{{ item.url }}" class="nav-item {{ 'active' if item.key == active_nav else '' }}">
        <span class="nav-item__icon">{{ item.icon }}</span>
        <span>{{ item.label }}</span>
      </a>
      {% endfor %}
    </div>
    {% endfor %}
  </nav>

  <div class="sidebar__footer">
    <a href="{{ url_for('smartpoint_demo') }}">&larr; Consultant view</a>
  </div>
</aside>
